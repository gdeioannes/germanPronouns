<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Calm effects, applied before first paint so no flashy animation
		     starts before the settings load. Mirrors SettingsKeys.calmEffects. -->
		<script>
			try {
				if (localStorage.getItem('calm_effects') === 'true')
					document.documentElement.dataset.effects = 'calm';
			} catch (e) {}
			// A second language (Turkish, Arabic): the page is prerendered in
			// English and switches right after hydration, so such a visitor's
			// page stays hidden until then (never longer than 1.5 s). Arabic
			// also turns the page right to left. Mirrors lang.svelte.ts pickLang.
			try {
				var L = ['en', 'tr', 'ar'];
				var q = new URLSearchParams(location.search).get('lang');
				var s = localStorage.getItem('ui_lang');
				var l = L.indexOf(q) >= 0 ? q : L.indexOf(s) >= 0 ? s : null;
				if (!l) {
					var bl = navigator.languages || [navigator.language];
					for (var i = 0; i < bl.length && !l; i++) {
						var c = String(bl[i]).slice(0, 2).toLowerCase();
						if (L.indexOf(c) >= 0) l = c;
					}
				}
				if (l && l !== 'en') {
					document.documentElement.dataset.uiLang = l;
					document.documentElement.lang = l;
					if (l === 'ar') document.documentElement.dir = 'rtl';
					setTimeout(function () {
						document.documentElement.dataset.langReady = '1';
					}, 1500);
				}
			} catch (e) {}
		</script>
		<style>
			html[data-ui-lang]:not([data-ui-lang='en']):not([data-lang-ready]) body {
				visibility: hidden;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
