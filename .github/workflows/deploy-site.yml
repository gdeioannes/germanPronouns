# Builds, checks and deploys the SvelteKit app to GitHub Pages.
#
# This is the only deploy workflow: the Flutter build it replaced is gone, and
# the project now lives at the repository root. `adapter-static` writes an
# `index.html` at the root of `build/` plus its assets, which is the shape the
# Pages configuration (apex custom domain, base href `/`) already expects.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "Main"]
  pull_request:
    branches: ["main", "Main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with any other Pages workflow, so two deploys can never race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      # Prerenders every route, including one page per quiz. A content bundle
      # that a renderer can't handle fails the build here rather than shipping
      # a blank page — that is how the big-text cloze gap was caught.
      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Static output" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- pages: $(find build -name '*.html' | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- total: $(du -sh build | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # GitHub Pages serves the uploaded artifact verbatim (no Jekyll), but the
      # marker keeps the `_app/` directory safe if the site is ever published
      # from a branch instead. CNAME is what keeps the custom domain bound.
      - name: Add Pages markers
        run: |
          touch build/.nojekyll
          echo "languagequiz.org" > build/CNAME

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
