name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: ["main", "Main"]
  pull_request:
    branches: ["main", "Main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Version stamp: the marketing version comes from pubspec.yaml, the build
      # number from the CI run counter and the timestamp/commit from this run,
      # so every deploy is self-describing without a manual bump.
      - name: Compute build stamp
        id: stamp
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build web app
        run: |
          flutter build web --release --base-href "/" \
            --build-name="${{ steps.stamp.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=TTS_PROXY_URL=https://german-tts-proxy.gdeioannes.workers.dev \
            --dart-define=BUILD_VERSION="${{ steps.stamp.outputs.version }}" \
            --dart-define=BUILD_NUMBER="${{ github.run_number }}" \
            --dart-define=BUILD_TIME="${{ steps.stamp.outputs.time }}" \
            --dart-define=BUILD_COMMIT="${{ steps.stamp.outputs.commit }}"

      # 🌟 CRITICAL STEP: Add this to keep GitHub Pages tied to your custom domain
      - name: Inject CNAME file
        run: echo "languagequiz.org" > build/web/CNAME

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
